name: rai-data
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  rai-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No real-looking personal data in added lines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR" -R "$GITHUB_REPOSITORY" | python3 scripts/check_rai_data.py
