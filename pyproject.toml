[project]
name = "github-labs"
version = "0.1.0"
description = "Toy transaction-screening service (synthetic data only) used as a proving ground for GH-600."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115",
    "mcp[cli]>=2.3.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Day 18: every run prints coverage, so "coverage delta" comes from a log
addopts = "--cov=app --cov-report=term"
