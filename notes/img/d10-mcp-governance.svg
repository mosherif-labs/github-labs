<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 1120 675" width="1120" height="675" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-10" width="1120" height="675" fill="#ffffff"/><rect x="20" y="95" width="250" height="150" rx="12" stroke="#1971c2" stroke-width="2" fill="#d0ebff"/><rect x="320" y="95" width="250" height="150" rx="12" stroke="#1971c2" stroke-width="2" fill="#e7f5ff"/><rect x="620" y="95" width="250" height="150" rx="12" stroke="#7048e8" stroke-width="2" fill="#f3f0ff"/><rect x="920" y="120" width="180" height="100" rx="12" stroke="#2f9e44" stroke-width="2" fill="#ebfbee"/><polyline points="270.0,170.0 320.0,170.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="308.9,174.7 320.0,170.0 308.9,165.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="570.0,170.0 620.0,170.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="608.9,174.7 620.0,170.0 608.9,165.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="870.0,170.0 920.0,170.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="908.9,174.7 920.0,170.0 908.9,165.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="20.0,320.0 1100.0,320.0" stroke="#e03131" stroke-width="3" fill="none" stroke-dasharray="8 6"/><rect x="20" y="405" width="250" height="110" rx="12" stroke="#e8590c" stroke-width="2" fill="#fff4e6"/><rect x="20" y="535" width="250" height="110" rx="12" stroke="#e8590c" stroke-width="2" fill="#fff4e6"/><rect x="370" y="460" width="250" height="130" rx="12" stroke="#f59e0b" stroke-width="2" fill="#fff3bf"/><rect x="720" y="475" width="180" height="100" rx="12" stroke="#2f9e44" stroke-width="2" fill="#ebfbee"/><polyline points="270.0,460.0 370.0,505.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="358.0,504.7 370.0,505.0 361.8,496.2" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="270.0,590.0 370.0,550.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="361.5,558.4 370.0,550.0 358.0,549.8" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="620.0,525.0 720.0,525.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="708.9,529.7 720.0,525.0 708.9,520.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><text x="20.0" y="36.0" font-size="26" fill="#1e1e1e" text-anchor="start">Day 10 · Who can stop which MCP server, where</text><text x="20.0" y="77.0" font-size="17" fill="#1971c2" text-anchor="start">LANE 1 · IDEs + Copilot CLI  (org / enterprise policies apply)</text><text x="145.0" y="131.5" font-size="14" fill="#1e1e1e" text-anchor="middle">ENTERPRISE  (enterprise owners)</text><text x="145.0" y="149.0" font-size="14" fill="#1e1e1e" text-anchor="middle">AI controls → MCP</text><text x="145.0" y="166.5" font-size="14" fill="#1e1e1e" text-anchor="middle">①②③ knobs</text><text x="145.0" y="184.0" font-size="14" fill="#1e1e1e" text-anchor="middle">+ managed-settings.json</text><text x="145.0" y="201.5" font-size="14" fill="#1e1e1e" text-anchor="middle">allow / deny, deny wins</text><text x="145.0" y="219.0" font-size="14" fill="#1e1e1e" text-anchor="middle">(.github-private or MDM)</text><text x="445.0" y="131.5" font-size="14" fill="#1e1e1e" text-anchor="middle">ORG  (org owners)</text><text x="445.0" y="149.0" font-size="14" fill="#1e1e1e" text-anchor="middle">Settings → Copilot → Policies</text><text x="445.0" y="166.5" font-size="14" fill="#1e1e1e" text-anchor="middle">① MCP servers in Copilot</text><text x="445.0" y="184.0" font-size="14" fill="#1e1e1e" text-anchor="middle">② MCP Registry URL</text><text x="445.0" y="201.5" font-size="14" fill="#1e1e1e" text-anchor="middle">③ Restrict: Allow all /</text><text x="445.0" y="219.0" font-size="14" fill="#1e1e1e" text-anchor="middle">    Registry only</text><text x="745.0" y="140.2" font-size="14" fill="#1e1e1e" text-anchor="middle">DEVELOPER CLIENT</text><text x="745.0" y="157.8" font-size="14" fill="#1e1e1e" text-anchor="middle">VS Code ≥ 1.109.3</text><text x="745.0" y="175.2" font-size="14" fill="#1e1e1e" text-anchor="middle">Copilot CLI ≥ 1.0.11</text><text x="745.0" y="192.8" font-size="14" fill="#1e1e1e" text-anchor="middle">Visual Studio ≥ 18.4.0</text><text x="745.0" y="210.2" font-size="14" fill="#1e1e1e" text-anchor="middle">JetBrains · Eclipse · Xcode</text><text x="1010.0" y="166.2" font-size="15" fill="#1e1e1e" text-anchor="middle">MCP server</text><text x="1010.0" y="185.0" font-size="15" fill="#1e1e1e" text-anchor="middle">(local or remote)</text><text x="20.0" y="269.0" font-size="14" fill="#495057" text-anchor="start">Enterprise beats org  ·  then Registry only beats Allow all  ·  then newest registry</text><text x="620.0" y="269.0" font-size="14" fill="#e03131" text-anchor="start">Registry check = name/ID match only</text><text x="620.0" y="286.5" font-size="14" fill="#e03131" text-anchor="start">(rename in config file → bypass)</text><text x="300.0" y="344.0" font-size="16" fill="#e03131" text-anchor="start">org / enterprise MCP policies stop here: they do NOT reach the cloud agent</text><text x="20.0" y="387.0" font-size="17" fill="#e8590c" text-anchor="start">LANE 2 · Copilot cloud agent  (repo-level gates only)</text><text x="145.0" y="439.0" font-size="14" fill="#1e1e1e" text-anchor="middle">REPO ADMINS</text><text x="145.0" y="456.5" font-size="14" fill="#1e1e1e" text-anchor="middle">Repo Settings → Copilot →</text><text x="145.0" y="474.0" font-size="14" fill="#1e1e1e" text-anchor="middle">MCP servers (JSON)</text><text x="145.0" y="491.5" font-size="14" fill="#1e1e1e" text-anchor="middle">processed LAST = wins</text><text x="145.0" y="569.0" font-size="14" fill="#1e1e1e" text-anchor="middle">PR MERGED to default branch</text><text x="145.0" y="586.5" font-size="14" fill="#1e1e1e" text-anchor="middle">.github/agents/*.agent.md</text><text x="145.0" y="604.0" font-size="14" fill="#1e1e1e" text-anchor="middle">mcp-servers: (this agent only)</text><text x="145.0" y="621.5" font-size="14" fill="#1e1e1e" text-anchor="middle">guard: CODEOWNERS + ruleset</text><text x="495.0" y="504.0" font-size="14" fill="#1e1e1e" text-anchor="middle">COPILOT CLOUD AGENT</text><text x="495.0" y="521.5" font-size="14" fill="#1e1e1e" text-anchor="middle">(+ code review for repo JSON)</text><text x="495.0" y="539.0" font-size="14" fill="#1e1e1e" text-anchor="middle">no approval prompt:</text><text x="495.0" y="556.5" font-size="14" fill="#1e1e1e" text-anchor="middle">tools run autonomously</text><text x="810.0" y="512.8" font-size="14" fill="#1e1e1e" text-anchor="middle">MCP server</text><text x="810.0" y="530.2" font-size="14" fill="#1e1e1e" text-anchor="middle">(secret = Agents secret</text><text x="810.0" y="547.8" font-size="14" fill="#1e1e1e" text-anchor="middle">COPILOT_MCP_*)</text><text x="370.0" y="619.0" font-size="14" fill="#e03131" text-anchor="start">A one-repo admin can add an unapproved server here,</text><text x="370.0" y="636.5" font-size="14" fill="#e03131" text-anchor="start">and no org/enterprise policy blocks it.</text></svg>