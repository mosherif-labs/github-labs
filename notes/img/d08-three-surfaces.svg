<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1210 580" width="1210" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="-20" y="-20" width="1210" height="580" fill="#ffffff"/><rect x="0" y="70" width="370" height="80" rx="12" stroke="#4a9eed" stroke-width="2" fill="#a5d8ff"/><rect x="400" y="70" width="370" height="80" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#d0bfff"/><rect x="800" y="70" width="370" height="80" rx="12" stroke="#ef4444" stroke-width="2" fill="#ffc9c9"/><rect x="0" y="180" width="370" height="110" rx="12" stroke="#4a9eed" stroke-width="2" fill="#e7f5ff"/><rect x="400" y="180" width="370" height="110" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#f3f0ff"/><rect x="800" y="180" width="370" height="110" rx="12" stroke="#ef4444" stroke-width="2" fill="#fff5f5"/><rect x="0" y="320" width="370" height="110" rx="12" stroke="#4a9eed" stroke-width="2" fill="#e7f5ff"/><rect x="400" y="320" width="370" height="110" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#f3f0ff"/><rect x="800" y="320" width="370" height="110" rx="12" stroke="#ef4444" stroke-width="2" fill="#fff5f5"/><rect x="0" y="460" width="370" height="80" rx="12" stroke="#4a9eed" stroke-width="2" fill="#e7f5ff"/><rect x="400" y="460" width="370" height="80" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#f3f0ff"/><rect x="800" y="460" width="370" height="80" rx="12" stroke="#ef4444" stroke-width="2" fill="#fff5f5"/><text x="150.0" y="36.0" font-size="24" fill="#1e1e1e" text-anchor="start">The tools: line decides the belt</text><text x="90.0" y="76.0" font-size="18" fill="#757575" text-anchor="start">Profile says</text><text x="500.0" y="76.0" font-size="18" fill="#757575" text-anchor="start">Agent can use</text><text x="250.0" y="28.0" font-size="28" fill="#1e1e1e" text-anchor="start">Who stops a risky tool? Depends on the surface</text><text x="185.0" y="105.0" font-size="20" fill="#1e1e1e" text-anchor="middle">Copilot CLI</text><text x="185.0" y="130.0" font-size="20" fill="#1e1e1e" text-anchor="middle">(you&#x27;re at the terminal)</text><text x="585.0" y="105.0" font-size="20" fill="#1e1e1e" text-anchor="middle">VS Code agent mode</text><text x="585.0" y="130.0" font-size="20" fill="#1e1e1e" text-anchor="middle">(you&#x27;re in the editor)</text><text x="985.0" y="105.0" font-size="20" fill="#1e1e1e" text-anchor="middle">Cloud agent</text><text x="985.0" y="130.0" font-size="20" fill="#1e1e1e" text-anchor="middle">(nobody is watching)</text><text x="185.0" y="219.2" font-size="18" fill="#1e1e1e" text-anchor="middle">Gate: prompt +</text><text x="185.0" y="241.8" font-size="18" fill="#1e1e1e" text-anchor="middle">--allow-tool / --deny-tool</text><text x="185.0" y="264.2" font-size="18" fill="#1e1e1e" text-anchor="middle">(deny always wins)</text><text x="585.0" y="219.2" font-size="18" fill="#1e1e1e" text-anchor="middle">Gate: approval prompt</text><text x="585.0" y="241.8" font-size="18" fill="#1e1e1e" text-anchor="middle">Allow = once; dropdown =</text><text x="585.0" y="264.2" font-size="18" fill="#1e1e1e" text-anchor="middle">session / workspace / always</text><text x="985.0" y="219.2" font-size="18" fill="#1e1e1e" text-anchor="middle">Gate: profile tools: list</text><text x="985.0" y="241.8" font-size="18" fill="#1e1e1e" text-anchor="middle">(+ hooks, Day 13)</text><text x="985.0" y="264.2" font-size="18" fill="#1e1e1e" text-anchor="middle">NO prompt, no approver</text><text x="185.0" y="359.2" font-size="18" fill="#1e1e1e" text-anchor="middle">Auto-approve: --allow-tool</text><text x="185.0" y="381.8" font-size="18" fill="#1e1e1e" text-anchor="middle">Saved: permissions-config.json</text><text x="185.0" y="404.2" font-size="18" fill="#1e1e1e" text-anchor="middle">(per location, survives)</text><text x="585.0" y="359.2" font-size="18" fill="#1e1e1e" text-anchor="middle">Auto-approve:</text><text x="585.0" y="381.8" font-size="18" fill="#1e1e1e" text-anchor="middle">chat.tools.terminal.autoApprove</text><text x="585.0" y="404.2" font-size="18" fill="#1e1e1e" text-anchor="middle">(global.autoApprove = risky)</text><text x="985.0" y="359.2" font-size="18" fill="#1e1e1e" text-anchor="middle">Nothing to auto-approve:</text><text x="985.0" y="381.8" font-size="18" fill="#1e1e1e" text-anchor="middle">least privilege lives</text><text x="985.0" y="404.2" font-size="18" fill="#1e1e1e" text-anchor="middle">in the profile</text><text x="185.0" y="506.8" font-size="18" fill="#1e1e1e" text-anchor="middle">Undo: /reset-allowed-tools</text><text x="585.0" y="495.5" font-size="18" fill="#1e1e1e" text-anchor="middle">Undo: Chat: Reset Tool</text><text x="585.0" y="518.0" font-size="18" fill="#1e1e1e" text-anchor="middle">Confirmations (Command Palette)</text><text x="985.0" y="495.5" font-size="18" fill="#1e1e1e" text-anchor="middle">Undo: edit the profile</text><text x="985.0" y="518.0" font-size="18" fill="#1e1e1e" text-anchor="middle">(PR to .github/agents/)</text></svg>