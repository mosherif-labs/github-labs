<svg xmlns="http://www.w3.org/2000/svg" viewBox="-44 -20 1018 340" width="1018" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="-44" y="-20" width="1018" height="340" fill="#ffffff"/><rect x="20" y="50" width="170" height="80" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb"/><polyline points="190.0,90.0 240.0,90.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="228.9,94.7 240.0,90.0 228.9,85.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="240" y="50" width="170" height="80" rx="12" stroke="#e03131" stroke-width="2" fill="#ffc9c9"/><polyline points="410.0,90.0 460.0,90.0" stroke="#e03131" stroke-width="2" fill="none"/><polyline points="448.9,94.7 460.0,90.0 448.9,85.3" fill="none" stroke="#e03131" stroke-width="2"/><rect x="460" y="50" width="170" height="80" rx="12" stroke="#868e96" stroke-width="2" fill="#e9ecef" stroke-dasharray="8 6"/><polyline points="630.0,90.0 680.0,90.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="668.9,94.7 680.0,90.0 668.9,85.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="680" y="40" width="230" height="100" rx="12" stroke="#1971c2" stroke-width="2" fill="#a5d8ff"/><rect x="20" y="230" width="890" height="70" rx="12" stroke="#f08c00" stroke-width="2" fill="#fff3bf"/><text x="20.0" y="22.0" font-size="22" fill="#1e1e1e" text-anchor="start">copilot-setup-steps: what happens when a step fails</text><text x="105.0" y="86.0" font-size="16" fill="#1e1e1e" text-anchor="middle">1. checkout</text><text x="105.0" y="106.0" font-size="16" fill="#1e1e1e" text-anchor="middle">✓ exit 0</text><text x="325.0" y="86.0" font-size="16" fill="#1e1e1e" text-anchor="middle">2. uv sync --locked</text><text x="325.0" y="106.0" font-size="16" fill="#1e1e1e" text-anchor="middle">✗ exit 1</text><text x="545.0" y="86.0" font-size="16" fill="#1e1e1e" text-anchor="middle">3. uv run pytest</text><text x="545.0" y="106.0" font-size="16" fill="#1e1e1e" text-anchor="middle">SKIPPED (rest skipped)</text><text x="795.0" y="76.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Agent STARTS anyway</text><text x="795.0" y="96.0" font-size="16" fill="#1e1e1e" text-anchor="middle">with the environment as-is</text><text x="795.0" y="116.0" font-size="16" fill="#1e1e1e" text-anchor="middle">(no abort, no retry)</text><text x="20.0" y="180.0" font-size="15" fill="#495057" text-anchor="start">Consequence: a broken setup step doesn&#x27;t stop the session. The agent works on a half-built</text><text x="20.0" y="198.8" font-size="15" fill="#495057" text-anchor="start">environment and falls back to trial-and-error installs. Check the Actions run is green.</text><text x="465.0" y="261.5" font-size="14" fill="#1e1e1e" text-anchor="middle">Rules: .github/workflows/copilot-setup-steps.yml · ONE job named exactly copilot-setup-steps · file on the DEFAULT branch</text><text x="465.0" y="279.0" font-size="14" fill="#1e1e1e" text-anchor="middle">Customizable keys only: steps · permissions · runs-on · services · snapshot · timeout-minutes (max 59). Other keys are ignored.</text></svg>