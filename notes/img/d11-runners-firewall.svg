="#1e1e1e" text-anchor="middle">Agent can use it?</text><text x="700.0" y="86.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Integrated firewall</text><text x="170.0" y="146.0" font-size="16" fill="#1e1e1e" text-anchor="middle">GitHub-hosted Ubuntu x64</text><text x="410.0" y="146.0" font-size="16" fill="#1e1e1e" text-anchor="middle">YES</text><text x="700.0" y="146.0" font-size="16" fill="#1e1e1e" text-anchor="middle">works (on by default)</text><text x="170.0" y="206.0" font-size="16" fill="#1e1e1e" text-anchor="middle">GitHub-hosted Windows 64-bit</text><text x="410.0" y="206.0" font-size="16" fill="#1e1e1e" text-anchor="middle">YES</text><text x="700.0" y="206.0" font-size="16" fill="#1e1e1e" text-anchor="middle">NOT compatible: use your own network controls</text><text x="170.0" y="266.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Self-hosted (ARC, ephemeral, single-use)</text><text x="410.0" y="266.0" font-size="16" fill="#1e1e1e" text-anchor="middle">YES</text><text x="700.0" y="266.0" font-size="16" fill="#1e1e1e" text-anchor="middle">MUST be disabled</text><text x="170.0" y="326.0" font-size="16" fill="#1e1e1e" text-anchor="middle">macOS / ARM / anything else</text><text x="410.0" y="326.0" font-size="16" fill="#1e1e1e" text-anchor="middle">NO</text><text x="700.0" y="326.0" font-size="16" fill="#1e1e1e" text-anchor="middle">n/a</text><text x="20.0" y="375.0" font-size="15" fill="#495057" text-anchor="start">Firewall works only on GitHub-hosted Ubuntu x64. Leave that box and you own the network controls.</text></svg>