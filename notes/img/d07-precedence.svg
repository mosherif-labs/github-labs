<svg xmlns="http://www.w3.org/2000/svg" width="780" height="545" viewBox="0 0 780 545"><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="42" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold">Instruction precedence: closest to YOU wins (then zoom out)</text><text x="30" y="69" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#495057">All relevant sets still reach the model; precedence only decides who wins a conflict</text><rect x="30" y="95" width="720" height="62" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text x="44" y="123" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#6741d9" font-weight="bold">1</text><text x="90" y="121" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1e1e1e" font-weight="bold">Personal</text><text x="90" y="142" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#495057">your own instructions, set on your account</text><line x1="60" y1="157" x2="60" y2="171" stroke="#495057" stroke-width="2"/><polygon points="54,167 66,167 60,177" fill="#495057"/><rect x="90" y="177" width="660" height="62" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="104" y="205" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1971c2" font-weight="bold">2a</text><text x="150" y="203" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1e1e1e" font-weight="bold">Path-specific</text><text x="150" y="224" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#495057">.github/instructions/**/*.instructions.md (applyTo glob)</text><line x1="120" y1="239" x2="120" y2="253" stroke="#495057" stroke-width="2"/><polygon points="114,249 126,249 120,259" fill="#495057"/><rect x="90" y="259" width="660" height="62" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="104" y="287" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1971c2" font-weight="bold">2b</text><text x="150" y="285" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1e1e1e" font-weight="bold">Repository-wide</text><text x="150" y="306" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#495057">.github/copilot-instructions.md</text><line x1="120" y1="321" x2="120" y2="335" stroke="#495057" stroke-width="2"/><polygon points="114,331 126,331 120,341" fill="#495057"/><rect x="90" y="341" width="660" height="62" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="104" y="369" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1971c2" font-weight="bold">2c</text><text x="150" y="367" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1e1e1e" font-weight="bold">Agent instructions</text><text x="150" y="388" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#495057">AGENTS.md (nearest in the tree)</text><line x1="60" y1="403" x2="60" y2="417" stroke="#495057" stroke-width="2"/><polygon points="54,413 66,413 60,423" fill="#495057"/><rect x="30" y="423" width="720" height="62" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="44" y="451" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#2f9e44" font-weight="bold">3</text><text x="90" y="449" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1e1e1e" font-weight="bold">Organization</text><text x="90" y="470" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#495057">org-level custom instructions: lowest priority</text><rect x="20" y="170" width="740" height="250" rx="10" fill="transparent" stroke="#1971c2" stroke-width="2" stroke-dasharray="6 5" fill-opacity="0"/><text x="30" y="300" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1971c2" font-weight="bold">Repo</text><text x="30" y="525" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1e1e1e" font-weight="bold">Mnemonic: ME → MY PATH → MY REPO → MY AGENTS.md → MY ORG  (narrow beats broad)</text></svg>